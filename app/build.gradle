plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.wehaveaproblem.emudhra'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.wehaveaproblem.emudhra'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // The keystore is checked in on purpose: this is a throwaway app whose
    // entire purpose is to be sideloaded, and a stable signature keeps
    // upgrades possible. Never do this for a real product.
    signingConfigs {
        release {
            storeFile rootProject.file('keystore/release.jks')
            storePassword 'emudhra-checker'
            keyAlias 'emudhra-checker'
            keyPassword 'emudhra-checker'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
